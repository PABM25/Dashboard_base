name: Verificación

on:
  push:
    branches: [feat/dashboard-base-1926659609979317045]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Revisión de código
        run: pnpm lint
      - name: Compilación
        run: pnpm build
